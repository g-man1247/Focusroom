<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="html-head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${pageTitle} + ' | Focusroom'">Focusroom</title>
    
    <!-- Google Fonts & Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/focusroom.css}">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SockJS and STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>

<!-- Sidebar Fragment -->
<aside th:fragment="sidebar(activeTab)" class="app-sidebar" id="appSidebar">
    <div class="sidebar-header">
        <div class="brand-logo">F</div>
        <div class="brand-name">Focusroom</div>
    </div>

    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
            <i data-lucide="layout-dashboard"></i>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/rooms}" class="nav-item" th:classappend="${activeTab == 'rooms'} ? 'active' : ''">
            <i data-lucide="users"></i>
            <span>Study Rooms</span>
        </a>
        <a th:href="@{/timer}" class="nav-item" th:classappend="${activeTab == 'timer'} ? 'active' : ''">
            <i data-lucide="timer"></i>
            <span>Focus Timer</span>
        </a>
        <a th:href="@{/tasks}" class="nav-item" th:classappend="${activeTab == 'tasks'} ? 'active' : ''">
            <i data-lucide="check-square"></i>
            <span>Task Manager</span>
        </a>
        <a th:href="@{/analytics}" class="nav-item" th:classappend="${activeTab == 'analytics'} ? 'active' : ''">
            <i data-lucide="bar-chart-3"></i>
            <span>Study Analytics</span>
        </a>
        <a th:href="@{/notifications}" class="nav-item" th:classappend="${activeTab == 'notifications'} ? 'active' : ''">
            <i data-lucide="bell"></i>
            <span>Notifications</span>
            <span th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}" 
                  class="badge badge-private" style="margin-left: auto; font-size: 0.7rem;" 
                  th:text="${unreadNotificationCount}"></span>
        </a>
        
        <!-- Admin only navigation -->
        <div sec:authorize="hasRole('ADMIN')" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color);">
            <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-dim); padding: 0 14px 8px; font-weight: 700; letter-spacing: 0.5px;">Administration</div>
            <a th:href="@{/admin}" class="nav-item" th:classappend="${activeTab == 'admin'} ? 'active' : ''">
                <i data-lucide="shield-check"></i>
                <span>Admin Console</span>
            </a>
        </div>
    </nav>

    <div class="sidebar-footer" th:if="${currentUser != null}">
        <div class="user-avatar-badge" th:text="${#strings.substring(currentUser.fullName ?: currentUser.username, 0, 1)}">U</div>
        <div class="user-info-text">
            <div class="user-info-name" th:text="${currentUser.fullName ?: currentUser.username}">User Name</div>
            <div class="user-info-role" th:text="${currentUser.role == T(com.focusroom.entity.enums.Role).ROLE_ADMIN ? 'Administrator' : 'Student'}">Student</div>
        </div>
        <a th:href="@{/profile}" style="color: var(--text-muted); padding: 6px;" title="Profile Settings">
            <i data-lucide="settings" style="width: 18px; height: 18px;"></i>
        </a>
    </div>
</aside>

<!-- Top Navbar Fragment -->
<header th:fragment="navbar" class="app-navbar">
    <div style="display: flex; align-items: center; gap: 16px;">
        <button id="sidebarToggleBtn" class="action-btn" style="display: none;" onclick="document.getElementById('appSidebar').classList.toggle('open')">
            <i data-lucide="menu"></i>
        </button>
        <form th:action="@{/rooms}" method="get" class="nav-search">
            <i data-lucide="search" class="nav-search-icon"></i>
            <input type="text" name="search" placeholder="Search rooms or subjects..." th:value="${searchQuery}">
        </form>
    </div>

    <div class="navbar-actions">
        <a th:href="@{/rooms/create}" class="btn btn-primary btn-sm">
            <i data-lucide="plus-circle" style="width: 16px; height: 16px;"></i>
            <span>Create Room</span>
        </a>

        <a th:href="@{/notifications}" class="action-btn" title="Notifications">
            <i data-lucide="bell" style="width: 18px; height: 18px;"></i>
            <span class="notification-count" th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}" th:text="${unreadNotificationCount}"></span>
        </a>

        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="action-btn" title="Sign Out" style="background: transparent;">
                <i data-lucide="log-out" style="width: 18px; height: 18px; color: var(--text-muted);"></i>
            </button>
        </form>
    </div>
</header>

</body>
</html>
