<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html-head('Private Study Room Access')}"></head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/layout :: sidebar('rooms')}"></div>

    <main class="app-main">
        <header th:replace="~{fragments/layout :: navbar}"></header>

        <div class="page-content" style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
            <div class="card" style="width: 100%; max-width: 440px; text-align: center; padding: 36px;">
                <div style="width: 52px; height: 52px; border-radius: var(--radius-full); background: rgba(245, 158, 11, 0.15); color: #fbbf24; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                    <i data-lucide="lock" style="width: 24px; height: 24px;"></i>
                </div>

                <h1 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 8px;" th:text="${room.name}">Private Study Room</h1>
                <div style="font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-bottom: 12px;" th:text="${room.subject}">Subject</div>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 24px;">
                    This virtual room is private. Please enter the room's access code to join the study session.
                </p>

                <div th:if="${errorMessage}" class="alert alert-danger" style="text-align: left;">
                    <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/rooms/{id}/join(id=${room.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="form-group" style="text-align: left;">
                        <label class="form-label" for="accessCode">Access Code</label>
                        <input type="password" id="accessCode" name="accessCode" class="form-control" placeholder="Enter room passkey" required autofocus>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <a th:href="@{/rooms}" class="btn btn-secondary" style="flex: 1;">Cancel</a>
                        <button type="submit" class="btn btn-primary" style="flex: 1;">Join Room</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
