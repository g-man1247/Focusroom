<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Focusroom</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/focusroom.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, rgba(9, 13, 22, 1) 70%);
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
        }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo">F</div>
            <span class="brand-name">Focusroom</span>
        </div>

        <h1 style="font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 8px;">Welcome back</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 28px;">
            Enter your credentials to enter your digital study environment.
        </p>

        <!-- Flash messages -->
        <div th:if="${param.error}" class="alert alert-danger">
            <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
            <span>Invalid username, email, or password. Please try again.</span>
        </div>
        <div th:if="${param.logout}" class="alert alert-info">
            <i data-lucide="info" style="width: 18px; height: 18px;"></i>
            <span>You have been signed out successfully.</span>
        </div>
        <div th:if="${param.expired}" class="alert alert-warning">
            <i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
            <span>Your session has expired. Please sign in again.</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success">
            <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label" for="username">Username or Email</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="student or user@university.edu" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
                Sign In
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
            Don't have an account? 
            <a th:href="@{/register}" style="color: var(--primary); font-weight: 600;">Create one here</a>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
