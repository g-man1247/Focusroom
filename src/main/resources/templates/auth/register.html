<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Focusroom</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/focusroom.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, rgba(9, 13, 22, 1) 70%);
            padding: 32px 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
        }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo">F</div>
            <span class="brand-name">Focusroom</span>
        </div>

        <h1 style="font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 8px;">Create your account</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 28px;">
            Join virtual study rooms and start building productive study habits.
        </p>

        <!-- Error message -->
        <div th:if="${errorMessage}" class="alert alert-danger">
            <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/register}" th:object="${userRegistrationDto}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Alex Johnson" required>
                <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="e.g. alexj" required>
                <div class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">University or Personal Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="alex@university.edu" required>
                <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters" required>
                <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Re-enter password" required>
                <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
                Complete Registration
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
            Already have an account? 
            <a th:href="@{/login}" style="color: var(--primary); font-weight: 600;">Sign in here</a>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
