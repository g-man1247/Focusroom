<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html-head('User Profile')}"></head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/layout :: sidebar('profile')}"></div>

    <main class="app-main">
        <header th:replace="~{fragments/layout :: navbar}"></header>

        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Account Profile</h1>
                    <p class="page-subtitle">Manage your personal information and security credentials.</p>
                </div>
            </div>

            <!-- Flash alerts -->
            <div th:if="${successMessage}" class="alert alert-success">
                <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
                <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <div style="display: grid; grid-template-columns: 320px 1fr; gap: 24px;">
                <!-- Profile Overview Card -->
                <div class="card" style="text-align: center; height: fit-content;">
                    <div style="width: 80px; height: 80px; border-radius: var(--radius-full); background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: #fff; margin: 0 auto 16px; box-shadow: var(--accent-glow);"
                         th:text="${#strings.substring(profileUser.fullName ?: profileUser.username, 0, 1)}">
                        U
                    </div>
                    <h2 style="font-size: 1.25rem; font-weight: 700;" th:text="${profileUser.fullName ?: profileUser.username}">Name</h2>
                    <div style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px;" th:text="'@' + ${profileUser.username}">@user</div>
                    
                    <span class="badge" th:classappend="${profileUser.role == T(com.focusroom.entity.enums.Role).ROLE_ADMIN ? 'badge-admin' : 'badge-public'}" 
                          th:text="${profileUser.role == T(com.focusroom.entity.enums.Role).ROLE_ADMIN ? 'Administrator' : 'Student'}">Role</span>

                    <div style="border-top: 1px solid var(--border-color); margin-top: 24px; padding-top: 20px; text-align: left; font-size: 0.825rem; display: flex; flex-direction: column; gap: 10px;">
                        <div>
                            <span style="color: var(--text-dim);">Email: </span>
                            <span style="color: #fff; font-weight: 500;" th:text="${profileUser.email}">email</span>
                        </div>
                        <div>
                            <span style="color: var(--text-dim);">Member since: </span>
                            <span style="color: #fff;" th:text="${#temporals.format(profileUser.createdAt, 'MMM yyyy')}">Oct 2026</span>
                        </div>
                        <div>
                            <span style="color: var(--text-dim);">Status: </span>
                            <span style="color: var(--success); font-weight: 600;" th:text="${profileUser.accountStatus}">ACTIVE</span>
                        </div>
                    </div>
                </div>

                <!-- Forms Column: Edit Profile & Change Password -->
                <div style="display: flex; flex-direction: column; gap: 24px;">
                    <!-- Edit Profile Card -->
                    <div class="card">
                        <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 20px;">Personal Details</h2>

                        <form th:action="@{/profile/update}" th:object="${userProfileDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="grid-2" style="margin-bottom: 0;">
                                <div class="form-group">
                                    <label class="form-label" for="fullName">Full Name</label>
                                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="username">Username</label>
                                    <input type="text" id="username" th:field="*{username}" class="form-control" readonly style="opacity: 0.7; cursor: not-allowed;">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="email">Email Address</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="bio">Bio / Academic Interests</label>
                                <textarea id="bio" th:field="*{bio}" class="form-control" rows="3" placeholder="Tell other students what you are studying or interested in..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">Save Profile Changes</button>
                        </form>
                    </div>

                    <!-- Change Password Card -->
                    <div class="card">
                        <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 20px;">Security & Password</h2>

                        <form th:action="@{/profile/change-password}" th:object="${changePasswordDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="form-group">
                                <label class="form-label" for="currentPassword">Current Password</label>
                                <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-control" placeholder="••••••••" required>
                            </div>

                            <div class="grid-2" style="margin-bottom: 0;">
                                <div class="form-group">
                                    <label class="form-label" for="newPassword">New Password</label>
                                    <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" placeholder="At least 6 characters" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="confirmPassword">Confirm New Password</label>
                                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Re-enter new password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-secondary">Update Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
