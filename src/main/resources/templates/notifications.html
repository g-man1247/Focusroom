<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html-head('Notifications')}"></head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/layout :: sidebar('notifications')}"></div>

    <main class="app-main">
        <header th:replace="~{fragments/layout :: navbar}"></header>

        <div class="page-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Notifications</h1>
                    <p class="page-subtitle">Stay notified about completed study sessions, upcoming deadlines, and room updates.</p>
                </div>
                <form th:action="@{/notifications/read-all}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-secondary btn-sm" th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}">
                        <i data-lucide="check-check" style="width: 16px; height: 16px;"></i>
                        <span>Mark all as read</span>
                    </button>
                </form>
            </div>

            <!-- Flash alerts -->
            <div th:if="${successMessage}" class="alert alert-success">
                <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
                <span th:text="${successMessage}"></span>
            </div>

            <div th:if="${#lists.isEmpty(notifications)}" class="card" style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
                <i data-lucide="bell-off" style="width: 44px; height: 44px; color: var(--text-dim); margin-bottom: 12px;"></i>
                <h3 style="font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 4px;">No notifications</h3>
                <p style="font-size: 0.85rem;">You are all caught up! As you study and manage tasks, notifications will appear here.</p>
            </div>

            <div th:unless="${#lists.isEmpty(notifications)}" style="display: flex; flex-direction: column; gap: 12px;">
                <div th:each="n : ${notifications}" class="card" 
                     style="padding: 18px 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;"
                     th:styleappend="${!n.read} ? 'border-left: 3px solid var(--primary); background: rgba(99, 102, 241, 0.05);' : ''">
                    
                    <div style="display: flex; gap: 16px; align-items: flex-start;">
                        <div style="width: 36px; height: 36px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"
                             th:styleappend="${n.type == T(com.focusroom.entity.enums.NotificationType).SESSION_COMPLETED ? 'background: rgba(16, 185, 129, 0.15); color: #34d399;' : (n.type == T(com.focusroom.entity.enums.NotificationType).DEADLINE_ALERT ? 'background: rgba(245, 158, 11, 0.15); color: #fbbf24;' : 'background: rgba(99, 102, 241, 0.15); color: #818cf8;')}">
                            
                            <i th:if="${n.type == T(com.focusroom.entity.enums.NotificationType).SESSION_COMPLETED}" data-lucide="award" style="width: 18px; height: 18px;"></i>
                            <i th:if="${n.type == T(com.focusroom.entity.enums.NotificationType).DEADLINE_ALERT}" data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
                            <i th:if="${n.type != T(com.focusroom.entity.enums.NotificationType).SESSION_COMPLETED and n.type != T(com.focusroom.entity.enums.NotificationType).DEADLINE_ALERT}" data-lucide="bell" style="width: 18px; height: 18px;"></i>
                        </div>

                        <div>
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                                <h3 style="font-size: 0.95rem; font-weight: 700;" th:text="${n.title}">Notification Title</h3>
                                <span th:unless="${n.read}" class="badge badge-private" style="font-size: 0.65rem;">NEW</span>
                            </div>
                            <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 6px;" th:text="${n.message}">Message</p>
                            <span style="font-size: 0.75rem; color: var(--text-dim);" th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 8px;">
                        <a th:if="${n.linkUrl != null and !n.linkUrl.isBlank()}" th:href="@{${n.linkUrl}}" class="btn btn-secondary btn-sm">
                            <span>View</span>
                            <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
                        </a>

                        <form th:unless="${n.read}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="action-btn" title="Mark as read" style="width: 32px; height: 32px;">
                                <i data-lucide="check" style="width: 14px; height: 14px;"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
